IMAGE_NAME="claude-coder"
TAG="latest"
CLI_COMMAND="claude"
VERBOSE_FLAG="--verbose"
STREAM_FORMATTER="stream-formatter.py"

# --- Per-mode CLI argument contract ---
# ARGS_COMMON is prepended in every mode. The {{PROMPT}} token in a mode array
# is replaced with the final prompt text; a mode without the token never
# receives a prompt.
ARGS_COMMON=("--permission-mode" "bypassPermissions")
ARGS_INTERACTIVE=()
ARGS_TUI=("{{PROMPT}}")
ARGS_HEADLESS=("-p" "{{PROMPT}}")
ARGS_STREAM=("-p" "{{PROMPT}}" "--output-format" "stream-json" "--verbose")

ENV_VARS=("ANTHROPIC_API_KEY")
VOLUMES=(
  "-v" "agentic-coder-claude:/home/node/.claude"
)
LOG_PATH="debug/*.txt"
TROUBLESHOOTING_TIP="Since you are using Google/Anthropic OAuth (no ANTHROPIC_API_KEY detected), the session token inside the Docker volume may have expired or is missing. Please run the agent in interactive TUI mode first to complete the authentication flow: run-agent.sh -c claude ."
