IMAGE_NAME="claude-coder"
TAG="latest"
CLI_COMMAND="claude"
VERBOSE_FLAG="--verbose"
STREAM_FORMATTER="stream-formatter.py"

# --- Per-mode CLI argument contract ---
# ARGS_COMMON is prepended in every mode. The {{PROMPT}} token in a mode array
# is replaced with the final prompt text; a mode without the token never
# receives a prompt.
ARGS_COMMON=("--permission-mode" "bypassPermissions")
ARGS_INTERACTIVE=()
ARGS_TUI=("{{PROMPT}}")
ARGS_HEADLESS=("-p" "{{PROMPT}}")
ARGS_STREAM=("-p" "{{PROMPT}}" "--output-format" "stream-json" "--verbose")

# --- Per-mode container stdin/TTY contract ---
# The CLI switches itself to --print when stdin is not a terminal, so the two
# interactive modes must be given a PTY. The streamed mode pipes stdout into the
# formatter and reads stdin from /dev/null, so it must not ask for one.
STDIN_INTERACTIVE=("-i" "-t")
STDIN_TUI=("-i" "-t")
STDIN_HEADLESS=("-i")
STDIN_STREAM=("-i")

ENV_VARS=("ANTHROPIC_API_KEY")
# Deliberately scoped to ~/.claude, not the whole home directory: the CLI is
# installed under ~/.local/bin, so a mount at /home/node would shadow it and
# pin the binary in state that outlives `docker rmi` — a rebuilt image would
# keep running the old CLI. Rebuilding must be a complete reset.
#
# CLAUDE_CONFIG_DIR=/home/node/.claude is set in Dockerfile to direct
# global configuration (~/.claude.json, credentials, directory trust, and settings)
# into /home/node/.claude inside the persistent volume, preventing credential loss
# and re-prompting for folder trust across container runs.
VOLUMES=(
  "-v" "agentic-coder-claude:/home/node/.claude"
)
LOG_PATH="debug/*.txt"
TROUBLESHOOTING_TIP="Since you are using Google/Anthropic OAuth (no ANTHROPIC_API_KEY detected), the session token inside the Docker volume may have expired or is missing. Please run the agent in interactive TUI mode first to complete the authentication flow: run-agent.sh -c claude ."
