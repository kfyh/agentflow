IMAGE_NAME="copilot-coder"
TAG="latest"
CLI_COMMAND="copilot"
VERBOSE_FLAG="--verbose"

# --- Per-mode CLI argument contract ---
# ARGS_COMMON is prepended in every mode.
# --allow-all grants full permission to tools, paths, and shell execution in the isolated sandbox.
# --no-ask-user suppresses clarifying questions during automated runs.
ARGS_COMMON=("--allow-all" "--no-ask-user")
ARGS_INTERACTIVE=()
ARGS_TUI=("{{PROMPT}}")
ARGS_HEADLESS=("-p" "{{PROMPT}}")

# --- Per-mode container stdin/TTY contract ---
STDIN_INTERACTIVE=("-i" "-t")
STDIN_TUI=("-i" "-t")
STDIN_HEADLESS=("-i")

ENV_VARS=("COPILOT_GITHUB_TOKEN" "GH_TOKEN" "GITHUB_TOKEN")
VOLUMES=(
  "-v" "agentic-coder-copilot:/home/node/.copilot"
)
LOG_PATH="logs/*.log"
TROUBLESHOOTING_TIP="Since you are using GitHub OAuth (no COPILOT_GITHUB_TOKEN, GH_TOKEN, or GITHUB_TOKEN detected), the session token inside the Docker volume may have expired or is missing. Please run the agent in interactive TUI mode first to complete the authentication flow: run-agent.sh -c copilot ."
