IMAGE_NAME="mistral-coder"
TAG="latest"
CLI_COMMAND="vibe"

# --- Per-mode CLI argument contract ---
# ARGS_COMMON is prepended in every mode. The {{PROMPT}} token in a mode array
# is replaced with the final prompt text; a mode without the token never
# receives a prompt. No STREAM_FORMATTER is declared, so prompted runs use
# ARGS_HEADLESS.
ARGS_COMMON=()
ARGS_INTERACTIVE=()
ARGS_TUI=("{{PROMPT}}")
ARGS_HEADLESS=("-p" "{{PROMPT}}")

# --- Per-mode container stdin/TTY contract ---
# No STREAM_FORMATTER is declared, so STDIN_STREAM is never consulted.
STDIN_INTERACTIVE=("-i" "-t")
STDIN_TUI=("-i" "-t")
STDIN_HEADLESS=("-i")

# Loaded before the auth check so keys defined here count as API-key auth.
ENV_FILE="$HOME/.vibe/.env"

ENV_VARS=("MISTRAL_API_KEY")
VOLUMES=(
  "-v" "agentic-coder-vibe:/home/node/.vibe"
)
LOG_PATH="logs/**/*.log"
TROUBLESHOOTING_TIP="Since no MISTRAL_API_KEY is detected in your environment, the container relies on config files in the agentic-coder-vibe volume. If this is a new setup or your key is missing/expired, please run the agent in interactive mode first: run-agent.sh -c mistral ."
