IMAGE_NAME="agentic-coder"
TAG="latest"
CLI_COMMAND="agy"
STREAM_FORMATTER="stream-formatter.py"

# --- Per-mode CLI argument contract ---
# ARGS_COMMON is prepended in every mode. The {{PROMPT}} token in a mode array
# is replaced with the final prompt text; a mode without the token never
# receives a prompt.
ARGS_COMMON=()
ARGS_INTERACTIVE=()
ARGS_TUI=("{{PROMPT}}")
ARGS_HEADLESS=("-p" "{{PROMPT}}")
ARGS_STREAM=("-p" "{{PROMPT}}" "--output-format" "stream-json")

# --- Per-mode container stdin/TTY contract ---
# Interactive modes need a PTY; the streamed mode pipes stdout into the
# formatter and reads stdin from /dev/null, so it must not ask for one.
STDIN_INTERACTIVE=("-i" "-t")
STDIN_TUI=("-i" "-t")
STDIN_HEADLESS=("-i")
STDIN_STREAM=("-i")

ENV_VARS=("GEMINI_API_KEY")
VOLUMES=(
  "-v" "agentic-coder-gemini:/home/node/.gemini"
  "-v" "agentic-coder-config:/home/node/.config"
)
LOG_PATH="antigravity-cli/log/cli-*.log"
TROUBLESHOOTING_TIP="Since you are using Google One OAuth (no GEMINI_API_KEY detected), the session token inside the Docker volume may have expired or is missing. Please run the agent in interactive TUI mode first to complete the authentication flow: run-agent.sh -c gemini ."
